# --- Бэкенд Medusa: API и админка ---
server {
    server_name api.slytn.ru;

    # загрузка фотографий товаров
    client_max_body_size 25m;

    # Фотографии товаров отдаёт nginx из постоянной папки:
    # .medusa/server стирается каждой сборкой, снимки там не выживут.
    location /static/ {
        alias /var/lib/volento/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # админка живёт на отдельном имени admin.slytn.ru
    location /app {
        return 404;
    }

    # Адреса витрины, набранные на адресе API, уводим на витрину.
    location ~ ^/(ru|www)(/|$) {
        return 302 https://slytn.ru$request_uri;
    }

    location = / {
        return 302 https://slytn.ru/ru;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.slytn.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.slytn.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# --- Витрина Next.js ---
server {
    server_name slytn.ru www.slytn.ru;

    client_max_body_size 10m;

    # Пока магазин не открыт — витрина за паролем. Снять вместе с
    # ZAKAZY_OTKRYTY=true (DEPLOY.md, «Открытие магазина»).
    auth_basic "Volento";
    auth_basic_user_file /etc/nginx/.htpasswd-volento;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.slytn.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.slytn.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}

server {
    if ($host = api.slytn.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.slytn.ru;
    return 404; # managed by Certbot


}
server {
    if ($host = www.slytn.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = slytn.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name slytn.ru www.slytn.ru;
    return 404; # managed by Certbot




}
# --- Админка Medusa на отдельном имени ---
server {
    server_name admin.slytn.ru;

    client_max_body_size 25m;

    location = / {
        return 302 /app;
    }

    # Пути, которые действительно обслуживает движок: интерфейс админки
    # и запросы, которые он делает.
    location /app { include /etc/nginx/snippets/volento-backend.conf; }
    location /admin { include /etc/nginx/snippets/volento-backend.conf; }
    location /auth { include /etc/nginx/snippets/volento-backend.conf; }
    location /store { include /etc/nginx/snippets/volento-backend.conf; }
    location = /health { include /etc/nginx/snippets/volento-backend.conf; }

    # Всё остальное уводим в админку, а не показываем техническую ошибку
    # движка вида «Cannot GET /ru/account».
    location / {
        return 302 /app;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.slytn.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.slytn.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = admin.slytn.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.slytn.ru;
    return 404; # managed by Certbot


}===
