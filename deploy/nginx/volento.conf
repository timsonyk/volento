# Конфигурация nginx для Volento.
# Ставится в /etc/nginx/sites-available/volento со ссылкой в sites-enabled.
#
# Блоки listen 443 и ssl_certificate дописывает certbot при выпуске
# сертификата — здесь их намеренно нет. Порядок такой: положить этот файл,
# перезагрузить nginx, затем выпустить сертификат на все имена сразу.

# --- Бэкенд Medusa: витринный и админский API ---
server {
    listen 80;
    server_name api.slytn.ru;

    # загрузка фотографий товаров через админку
    client_max_body_size 25m;

    # Фотографии отдаёт nginx напрямую из постоянной папки.
    # Внутрь .medusa/server их класть нельзя: сборка стирает её целиком.
    location /static/ {
        alias /home/volento/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Админка живёт на отдельном имени, здесь её быть не должно
    location /app {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# --- Админка Medusa ---
server {
    listen 80;
    server_name admin.slytn.ru;

    client_max_body_size 25m;

    # корень ведёт сразу в интерфейс админки
    location = / {
        return 302 /app;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# --- Витрина Next.js ---
server {
    listen 80;
    server_name slytn.ru www.slytn.ru;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
